# docker compose up -d                -> PostGIS, MLflow, API, scheduler, UI
# docker compose run --rm pipeline all  -> one-off full pipeline run
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-umi}:${POSTGRES_PASSWORD:-umi}@db:5432/${POSTGRES_DB:-umi}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DATA_DIR: /app/data
    ARTIFACTS_DIR: /app/artifacts
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umi}
      POSTGRES_DB: ${POSTGRES_DB:-umi}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umi}"]
      interval: 5s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    volumes: [mlflow:/mlflow]
    ports: ["5000:5000"]

  api:
    <<: *app
    ports: ["8000:8000"]

  scheduler:
    <<: *app
    command: ["python", "scripts/scheduler.py"]
    restart: unless-stopped

  pipeline:
    <<: *app
    entrypoint: ["python", "-m", "src.pipeline"]
    profiles: ["manual"]

  ui:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  pgdata:
  mlflow:
